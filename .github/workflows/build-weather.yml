name: Build Weather Client
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log || {
            grep -E "error:|: error|What went wrong|Could not|FAILED" -A2 build.log | head -30 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: WeatherClient-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish jar to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release delete weather-latest -y --cleanup-tag || true
          gh release create weather-latest "$JAR" --title "WeatherClient latest build" --notes "Latest WeatherClient build"
