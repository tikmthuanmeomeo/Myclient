name: Build abcxyz 1.21.4
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log || {
            grep -E "error:|: error|What went wrong|Could not|FAILED" -A2 build.log | head -30 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }

      - name: Dump mappings (used to port code between versions)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find . "$HOME/.gradle" -name "*.tiny" -size +500k 2>/dev/null | while IFS= read -r f; do echo "::notice::tiny: $f"; done
          M=$(find . "$HOME/.gradle" -name "mappings.tiny" -size +500k 2>/dev/null | grep -i "1.21.4" | head -1)
          [ -n "$M" ] || M=$(find . "$HOME/.gradle" -name "*.tiny" -size +500k 2>/dev/null | head -1)
          echo "::notice::using: $M"
          touch build.log
          if [ -n "$M" ]; then
            gzip -c "$M" > mappings-1.21.4.tiny.gz
            gh release delete build-aux -y --cleanup-tag || true
            gh release create build-aux mappings-1.21.4.tiny.gz build.log --title "build aux" --notes "mappings dump for porting" --prerelease || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: abcxyz-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish jar to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          echo "jar: $JAR"
          gh release delete abcxyz-1.21.4-latest -y --cleanup-tag || true
          gh release create abcxyz-1.21.4-latest "$JAR" --target "${{ github.sha }}" --title "abcxyz 1.21.4 latest build" --notes "Latest abcxyz build for Minecraft 1.21.4" 2>&1 | tee rel.log || {
            while IFS= read -r line; do echo "::error::${line}"; done < rel.log
            exit 1
          }
