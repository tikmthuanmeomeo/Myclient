name: Build abcxyz 1.21.4
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log || {
            grep -E "error:|: error|What went wrong|Could not|FAILED" -A2 build.log | head -30 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: abcxyz-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish jar to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          echo "jar: $JAR"
          gh release delete abcxyz-1.21.4-latest -y --cleanup-tag || true
          gh release create abcxyz-1.21.4-latest "$JAR" --target "${{ github.sha }}" --title "abcxyz 1.21.4 latest build" --notes "Latest abcxyz build for Minecraft 1.21.4" 2>&1 | tee rel.log || {
            while IFS= read -r line; do echo "::error::${line}"; done < rel.log
            exit 1
          }
